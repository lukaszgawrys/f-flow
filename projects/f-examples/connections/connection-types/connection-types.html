<f-flow fDraggable>
  <f-canvas>
    <!-- Connections come straight from edges[].
         Each edge is bound to:
           - the source's single bottom output port
           - its *own* input port index on the target (computed per-target) -->
    <f-connection
      *ngFor="let e of edges"
      fType="bezier"
      [fRadius]="40"
      [fOffset]="12 + (inIndex(e) * 8)"
      [fOutputId]="outPortId(e.sourceId)"
      [fInputId]="inPortId(e.targetId, inIndex(e))"
    >
    </f-connection>

    <!-- Render nodes -->

    <div
      *ngFor="let n of nodes"
      fNode
      fDragHandle
      [fNodePosition]="n.position"
      style="position:relative; width:140px; padding:8px 12px;
               border:1px solid #ccc; border-radius:6px; text-align:center;"
    >
      {{ n.label }}

      <!-- Bottom output port (only if node has outgoing edges) -->
      <div
        *ngIf="hasOutgoing(n.id)"
        style="position:absolute; bottom:-2px; left:0; right:0; height:0; pointer-events:none;"
      >
        <div
          fNodeOutput
          [fOutputId]="outPortId(n.id)"
          [fOutputConnectableSide]="'bottom'"
          style="position:absolute; left:50%; bottom:0; width:8px; height:8px;
                   transform:translate(-50%, 50%); pointer-events:auto;"
        ></div>
      </div>

      <!-- Top input ports: count == number of incoming edges -->
      <div
        *ngIf="inCount(n.id) > 0"
        style="position:absolute; top:-2px; left:0; right:0; height:0; pointer-events:none;"
      >
        <ng-container
          *ngFor="let _ of [].constructor(inCount(n.id)); let i = index; let cnt = count"
        >
          <div
            fNodeInput
            [fInputId]="inPortId(n.id, i)"
            [fInputConnectableSide]="'top'"
            [style.left.%]="portLeftPercent(i, cnt)"
            style="position:absolute; top:0; width:8px; height:8px;
                     transform:translate(-50%, -50%); pointer-events:auto;"
          ></div>
        </ng-container>
      </div>
    </div>
  </f-canvas>
</f-flow>
